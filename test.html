    <!-- Loading Screen -->
<style>
  body.loading {
    overflow: hidden;
    height: 100vh;
}

    .loading-page {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:white;
        z-index: 9999;
        padding: 10px;
        box-sizing: border-box;
        user-select: none;
    }

    .loading-video {
        width: min(420px, 85vw);
        border-radius: 12px;
        pointer-events: none;
        display: block;
    }

    #loadingScreen {
        position: fixed;
        width: 100%; height: 100%;
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
           transition: opacity 0.8s ease, visibility 0.8s ease;
                   overflow: hidden;
    }

    #logo-merged path,
    #logo-merged polygon,
    #logo-merged rect {
        fill-opacity: 0;
        stroke: #c05a00;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    #logo-merged {
        width: min(300px, 80vw);
        height: auto;
        margin: -40px 0 -20px 0;
        display: block;
        opacity: 0;
    }

    #loadingScreen #logo-merged path {
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        stroke: url(#linear-gradient);
        stroke-width: 5;
        fill-opacity: 0;
    }

    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 5px;
    }

    .progress-bar {
        width: min(250px, 75vw);
        height: 8px;
        background: rgba(192, 90, 0, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #c05a00, #eba312, #c05a00);
        border-radius: 10px;
        animation: progressAnimation 2.9s ease-in-out forwards;
        box-shadow: 0 0 10px rgba(192, 90, 0, 0.5);
    }

    @keyframes progressAnimation {
        0% { width: 0%; }
        50% { width: 50%; }
        100% { width: 100%; }
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
        .loading-video {
            width: min(300px, 90vw);
            margin-bottom: -60px;
        }

        #logo-merged {
            width: min(200px, 85vw);
            margin: -30px 0 -15px 0;
        }

        .progress-bar {
            width: min(200px, 80vw);
            height: 5px;
        }

        .loader-container {
            margin-top: 3px;
        }
    }

    @media (min-width: 769px) {
        .loading-video {
            width: min(420px, 90vw);
            margin-bottom: -100px;
        }

        #logo-merged {
            width: min(300px, 85vw);
        }

        .progress-bar {
            width: min(250px, 80vw);
        }

        .loader-container {
            margin-top: 5px;
        }
    }

</style>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.body.classList.add("loading"); // Scroll lock start

window.addEventListener("DOMContentLoaded", () => {
    const loader = document.getElementById("loadingScreen");
    const shapes = document.querySelectorAll("#logo-merged path, #logo-merged polygon, #logo-merged rect");
    const fill = document.querySelector(".progress-fill");
    const svg = document.getElementById("logo-merged");

    // Hide SVG initially
    svg.style.opacity = 0;

    // Prepare strokes for animation
    shapes.forEach(el => {
        let length = 0;
        if (el.tagName === "PATH" && el.getTotalLength) {
            length = el.getTotalLength();
        } else {
            const bbox = el.getBBox();
            length = 2 * (bbox.width + bbox.height); 
        }

        el.style.strokeDasharray = length;
        el.style.strokeDashoffset = length;
        el.style.fillOpacity = 0;
    });

    // Make SVG visible instantly
    gsap.to(svg, { opacity: 1, duration: 0.08 });

    // Timeline
    const tl = gsap.timeline({
        onComplete: () => {
            // Smooth fade out loader
            gsap.to(loader, {
                opacity: 0,
                duration: 0.8,
                ease: "power1.inOut",
                onComplete: () => {
                    loader.style.visibility = "hidden";

                    // Smooth scroll restore
                    gsap.to(document.body, {
                        duration: 0.8,
                        onStart: () => document.body.classList.remove("loading")
                    });
                }
            });
        }
    });

    // Animate strokes
    tl.to(shapes, {
        strokeDashoffset: 0,
        duration: 2, 
        ease: "power2.inOut",
        stagger: 0.02         
    })
    // Animate fill
    .to(shapes, {
        fillOpacity: 1,
        duration: 1.2,
        ease: "power2.inOut"
    }, "-=1.8")
    // Animate progress bar
    .to(fill, {
        width: "100%",
        duration: 2, 
        ease: "linear"
    }, 0);
});
</script>
